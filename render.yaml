# Render Blueprint(Docker なし・Python ネイティブランタイム)。
# リポジトリを Render に接続すると、この定義で Web サービスが作られる。
# LLM は Modal(deploy/modal_ollama.py)または Google Colab 上の Ollama(gemma4:e2b)を使う。
# この環境には LibreOffice が無いため PDF のみ採点できる(pptx は画面で PDF 化を案内する)。
services:
  - type: web
    name: buchou-review
    runtime: python
    plan: free
    buildCommand: bin/render-build.sh
    startCommand: cd backend && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /api/health は Ollama に問い合わせるので使わない(Modal の GPU を定期的に起こしてしまう)
    healthCheckPath: /api/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # pnpm 11 は Node.js 22.13 以上が必要(bin/render-build.sh も同じ既定値)
      - key: NODE_VERSION
        value: 24.20.0
      # ビルド済み frontend(startCommand の cwd = backend からの相対パス)
      - key: REVIEW_STATIC_DIR
        value: ../frontend/dist
      # Modal なら `modal deploy` が表示した URL(固定)。Colab なら Cloudflare トンネルの URL(再起動で変わる)。
      # 公開リポジトリに載せないよう、値は Render のダッシュボードで入力する(sync: false)
      - key: REVIEW_OLLAMA_URL
        sync: false
      # Modal の proxy auth を使う場合: {"Modal-Key": "wk-...", "Modal-Secret": "ws-..."}(秘密値。ダッシュボードで入力)
      - key: REVIEW_OLLAMA_HEADERS
        sync: false
      - key: REVIEW_MODEL
        value: gemma4:e2b
      - key: REVIEW_MAX_PAGES
        value: "40"
      - key: REVIEW_MAX_UPLOAD_MB
        value: "50"
