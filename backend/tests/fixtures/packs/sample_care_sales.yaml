# 架空のサンプル基準パック(介護施設向けに提案営業をする会社を想定)。
# 実在の会社のルールではない。顧客のパックはリポジトリに置かないこと(REVIEW_STANDARD_PATH で渡す)。
name: サンプル基準(介護向け提案書)
version: "1.0"
rules:
  - id: R-NAME-01
    kind: forbid
    patterns: [サンプル介護ソフト]
    severity: must
    source: 提案書作成ガイドライン §1.3 社名表記
    message: 旧社名を使わない(現社名は「サンプルケア株式会社」)
  - id: R-REQ-01
    kind: required
    patterns: [料金|費用|お見積]
    regex: true
    severity: must
    source: 提案書作成ガイドライン §2.1 必須記載事項
    message: 料金(費用・お見積)を記載する
  - id: R-REQ-02
    kind: required
    patterns: [スケジュール|導入時期|導入の流れ]
    regex: true
    severity: must
    source: 提案書作成ガイドライン §2.2 必須記載事項
    message: 導入スケジュールを記載する
  - id: R-REQ-03
    kind: required
    patterns: [お問い合わせ|連絡先|担当者]
    regex: true
    severity: must
    source: 提案書作成ガイドライン §2.3 必須記載事項
    message: 問い合わせ先(担当者・連絡先)を記載する
  - id: R-TERM-01
    kind: prefer
    patterns: [利用者さん, 入居者さん]
    use: 利用者様
    severity: should
    source: 提案書作成ガイドライン §3.1 表記の統一
    message: 施設の利用者の呼び方を統一する
  - id: R-TERM-02
    kind: prefer
    patterns: [御社]
    use: 貴施設
    severity: should
    source: 提案書作成ガイドライン §3.2 表記の統一
    message: 提案先の施設の呼び方を統一する
  - id: R-EXPR-01
    kind: forbid
    patterns: [必ず, 絶対, 100%, 確実に]
    severity: must
    source: 提案書作成ガイドライン §4.2 効果の言い切りの禁止
    message: 効果を言い切らない(「見込めます」「期待できます」等にする)
  - id: R-EXPR-02
    kind: forbid
    patterns: [業界No.1, 日本一, 最高の]
    severity: should
    source: 提案書作成ガイドライン §4.3 根拠のない最上級表現
    message: 根拠のない最上級の表現を使わない
  - id: R-CONF-01
    kind: forbid
    patterns: [社外秘, 社内限, 取扱注意]
    severity: must
    source: 情報管理規程 §5.1 社外向け資料
    message: 社外向け資料に社内向けの機密区分を残さない
  - id: R-PRIV-01
    kind: forbid
    patterns: ['[一-龥]{1,4}様\s*[（(][0-9０-９]{2,3}歳']
    regex: true
    severity: must
    source: 個人情報取扱規程 §6.1
    message: 利用者の個人を特定できる情報(氏名と年齢)を載せない
