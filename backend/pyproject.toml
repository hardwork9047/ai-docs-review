[project]
name = "app"
version = "0.2.2"
description = "PowerPoint review backend (local LLM, boss persona)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests/pdf_factory.py を `tests.pdf_factory` として import する
# カバレッジ閾値は Makefile / CI 側で付与する(TDD の内側ループで
# 単一テストファイルを回すときに閾値で落ちないようにするため)

[tool.coverage.run]
source = ["src/app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RET", # return
]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
